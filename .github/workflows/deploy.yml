name: Deploy SkyMotion to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: skymotion-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy existing SkyMotion project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Prepare website files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          output = Path("dist")
          output.mkdir()
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for name in tracked:
              if not name:
                  continue
              source = Path(name)
              if any(part.startswith(".") for part in source.parts) or name == "README.md":
                  continue
              target = output / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          if not (output / "index.html").is_file():
              raise SystemExit("Missing index.html")
          PY

      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=skymotion --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
