name: Validate SkyMotion release

on:
  workflow_call:
    inputs:
      full_regression:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install pinned browser test tools
        run: npm ci --prefix tests/browser
      - name: Install Chromium and system dependencies
        run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Configure test browser
        run: |
          echo "SKY_MOTION_PLAYWRIGHT=$GITHUB_WORKSPACE/tests/browser/node_modules/playwright" >> "$GITHUB_ENV"
          node -e "console.log('SKY_MOTION_CHROMIUM='+require('./tests/browser/node_modules/playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run release checks
        env:
          FULL_REGRESSION: ${{ inputs.full_regression }}
        run: |
          if [ "$FULL_REGRESSION" = "true" ]; then
            node .github/scripts/verify-site.cjs
          else
            node .github/scripts/verify-site.cjs settings-center.cjs shared-ui-lifecycle.cjs settings-updates.cjs confirmed-review-fixes.cjs deployment-paths.cjs
          fi
