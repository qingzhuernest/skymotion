name: Publish SkyMotion

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the full regression suite before publishing
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: skymotion-production
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
    with:
      full_regression: ${{ github.event_name == 'workflow_dispatch' && inputs.full_regression == true }}
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    name: Deploy existing SkyMotion project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Prepare website files
        run: python3 .github/scripts/prepare_site.py

      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=skymotion --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  mirror:
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/github-pages.yml
