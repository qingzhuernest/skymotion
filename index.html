    <script>
      const $ = (id) => document.getElementById(id),
        reducedMotion = window.SkyPreferences?.reducedMotion || matchMedia('(prefers-reduced-motion:reduce)');
    </script>

    <script>
      // Recover only if the star script actually failed; never advance on elapsed time.
      document.addEventListener('DOMContentLoaded', () => {
        if (!window.skyWelcomeReady) {
          document.documentElement.classList.remove('welcome-opening');
          document.querySelectorAll('[data-opening-inert]').forEach(node => {
            node.inert = false;
            delete node.dataset.openingInert;
          });
        }
      }, {once:true});
    </script>
